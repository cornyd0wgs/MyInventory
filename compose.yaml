services:
  MyInventory-mysql:
    image: mysql:8.0
    container_name: MyInventory-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3311:3308"
    volumes:
      - MyInventory-db-data:/var/lib/mysql
    networks:
      - MyInventory-network

  MyInventory-phpmyadmin:
    image: phpmyadmin
    container_name: MyInventory-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: MyInventory-mysql
    ports:
      - "8081:80"
    depends_on:
      - MyInventory-mysql
    networks:
      - MyInventory-network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: MyInventory-php
    restart: unless-stopped
    volumes:
      - app-data:/var/www/html
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
    depends_on:
      - MyInventory-mysql
    networks:
      - MyInventory-network

  nginx:
    image: nginx:1.25-alpine
    container_name: MyInventory-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - app-data:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - MyInventory-network

volumes:
  MyInventory-db-data:
  app-data:

networks:
  MyInventory-network:
